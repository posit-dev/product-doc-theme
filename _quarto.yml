project:
  type: posit-docs
  render:
    - "*.qmd"
    - "!changelog.md"
  
website:
  title: ""
  page-navigation: true
  navbar:
    toggle-theme: false
    left:
      - text: "Version 2026-03-01"
        menu:
          - text: "Version 2026-03-01 (current)"
            href: "#"
          - text: "View all versions"
            href: "#"
    right:
      - text: "Home"
        href: index.qmd
      - text: "Admin Guide"
        href: admin.qmd
      - text: "User Guide"
        href: user.qmd
      - text: "How-to Guides"
        href: index.qmd
      - text: "Cookbook"
        href: index.qmd
      - text: "API Reference"
        href: index.qmd
      - text: "Release Notes"
        href: index.qmd

  # Hybrid navigation meant to show some amount of nested sidebar navigation
  # https://quarto.org/docs/websites/website-navigation.html#hybrid-navigation
  sidebar:
    - title: "Admin Guide"
      contents:
        - admin.qmd
        - section: Subsection
          contents:
            - text: Installation
              href: install.qmd
            - text: Duplicate
              href: install.qmd

    - title: "User Guide"
      contents:
        - user.qmd
        - section: Subsection
          contents:
            - text: Sharing
              href: sharing.qmd
            - text: Duplicate
              href: sharing.qmd
      style: "docked"

    - title: "Kitchen Sink"
      contents:
        - kitchen-sink.qmd
        - section: Getting Started
          contents:
            - text: Introduction
              href: kitchen-sink.qmd
            - text: Quick Start
              href: kitchen-sink.qmd
            - text: Installation Guide
              href: kitchen-sink.qmd
        - section: Core Features
          contents:
            - text: Authentication
              href: kitchen-sink.qmd
            - text: Data Management
              href: kitchen-sink.qmd
            - text: API Integration
              href: kitchen-sink.qmd
            - text: User Permissions
              href: kitchen-sink.qmd
        - section: Advanced Topics
          contents:
            - text: Custom Workflows
              href: kitchen-sink.qmd
            - text: Performance Tuning
              href: kitchen-sink.qmd
            - text: Security Best Practices
              href: kitchen-sink.qmd
        - section: Reference
          contents:
            - text: API Documentation
              href: kitchen-sink.qmd
            - text: Configuration Options
              href: kitchen-sink.qmd
            - text: Troubleshooting
              href: kitchen-sink.qmd
      style: "docked"

  page-footer:
    left:
      - text: <img src="/_extensions/posit-docs/assets/images/posit-logos-2024_horiz-full-color.svg" alt="Posit" width="65px" class="light-content posit-footer-logo"><img src="/_extensions/posit-docs/assets/images/posit-logo-fullcolor-TM.svg" alt="Posit" width="65px" class="dark-content posit-footer-logo">
        href: "https://posit.co"
      - Copyright &copy; 2000-{{< env CURRENT_YEAR >}} Posit Software, PBC. All Rights Reserved.
    center: |
      Posit PRODUCT {{< env PRODUCT_VERSION >}}
    right:
      - text: '<a href="#" id="open_preferences_center" title="Update cookie preferences">
              <img src="/_extensions/posit-docs/assets/images/cookie.svg" alt="Cookie Preferences" class="light-content" style="width: 1em; height: 1em;">
              <img src="/_extensions/posit-docs/assets/images/cookie-copy.svg" alt="Cookie Preferences" class="dark-content" style="width: 1em; height: 1em;">
           </a>'
        aria-label: 'Cookie Prefs'
      - text: Support
        aria-label: 'Link to Posit Support'
        href: "https://support.posit.co/hc/en-us"
      - text: Posit Docs
        aria-label: 'Link to Posit Docs'
        href: "https://docs.posit.co"

format:
  html:
    include-in-header:
      - _version-toast.html
    toc: true
    toc-expand: 2  # Shows levels 1 and 2 initially; deeper levels expand as you scroll
    smooth-scroll: true
    grid:
      sidebar-width: 320px
      body-width: 900px
      margin-width: 300px
      gutter-width: 2.75rem