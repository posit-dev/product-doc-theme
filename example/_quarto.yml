project:
  type: posit-docs
  render:
    - "*.qmd"
    - "!changelog.md"
  
website:
  title: 'Posit Product Documentation `<small>`{=html}Version {{< env PRODUCT_VERSION >}}`</small>`{=html}'
  page-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Admin Guide"
        href: admin.qmd
      - text: "User Guide"
        href: user.qmd
      - text: "Grid"
        href: grid.qmd

  # Hybrid navigation meant to show some amount of nested sidebar navigation
  # https://quarto.org/docs/websites/website-navigation.html#hybrid-navigation
  sidebar:
    - title: "Admin Guide"
      contents:
        - admin.qmd
        - section: Subsection
          contents:
            - text: Installing to Managed Service Providers
              href: install.qmd
            - text: Installation
              href: install.qmd
            - text: Duplicate
              href: install.qmd

    - title: "User Guide"
      contents:
        - user.qmd
        - section: Subsection
          contents:
            - text: Sharing
              href: sharing.qmd
            - text: Duplicate
              href: sharing.qmd
            - text: Using R from Python (rpy2)
              href: sharing.qmd
      style: "docked"

  page-footer:
    left:
      - text: '![Posit](/_extensions/posit-docs/assets/images/posit-logos-2024_horiz-full-color.svg){.light-content .posit-footer-logo width="65px"}![Posit](/_extensions/posit-docs/assets/images/posit-logo-fullcolor-TM.svg){.dark-content .posit-footer-logo width="65px"}'
        href: "https://posit.co"
      - Copyright &copy; 2000-{{< env CURRENT_YEAR >}} Posit Software, PBC. All Rights Reserved.
    center: |
      Posit PRODUCT {{< env PRODUCT_VERSION >}}
    right:
      - text: '[![Cookie Preferences](/_extensions/posit-docs/assets/images/cookie.svg){.light-content style="width: 1em; height: 1em;"}![Cookie Preferences](/_extensions/posit-docs/assets/images/cookie-copy.svg){.dark-content style="width: 1em; height: 1em;"}](#){#open_preferences_center title="Update cookie preferences"}'
        aria-label: 'Cookie Prefs'
      - text: Support
        aria-label: 'Link to Posit Support'
        href: "https://support.posit.co/hc/en-us/requests/new"
      - text: Posit Docs
        aria-label: 'Link to Posit Docs'
        href: "https://docs.posit.co"

format:
  html:
    include-in-header: 
      - _version-toast.html