title: posit-docs
author: Ashley Henry, David Aja, Aron Atkins
version: 8.1.5
quarto-required: ">=1.8.25"
contributes:
  project:
    project:
      type: website
    website:
      favicon: assets/images/favicon.svg
      bread-crumbs: true
      navbar:
        pinned: true
        logo: assets/images/posit-icon-fullcolor.svg
        logo-alt: Posit Documentation
        right:
          - text: Help
            menu:
            - text: Return to Posit Docs
              href: https://docs.posit.co
            - text: Posit Support
              href: https://support.posit.co/hc/en-us/requests/new
      search:
        copy-button: true
        show-item-context: true
    format:
      html:
        filters:
          - _fetch-versions.lua
        theme:
          light: [theme.scss, _posit-colors.scss]
          dark: [theme-dark.scss, _posit-colors.scss]
        highlight-style:
          light: github
          dark: github
        link-external-icon: true
        link-external-newwindow: true
        code-copy: true
        toc: true
        toc-expand: 1
        include-in-header:
          - "assets/_analytics.html"
          - "assets/_logo-dropdown.html"
          - "assets/_version-dropdown.html"
          - "assets/_mobile-menu.html"
        resources:
          - "assets/images/"


