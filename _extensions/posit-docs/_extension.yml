title: posit-docs
author: Ashley Henry, David Aja, Aron Atkins
version: 8.1.1
quarto-required: ">=1.8.25"
contributes:
  project:
    project:
      type: website
    website:
      favicon: "assets/images/favicon.svg"
      bread-crumbs: true
      navbar:
        pinned: true
        logo: "assets/images/logo_connect-fullcolor.svg"
        logo-alt: "Posit"
        title: "Docs"
      search:
        copy-button: true
        show-item-context: true
    format:
      html:
        filters:
          - _fetch-versions.lua
        theme:
          light: [theme.scss]
          dark: [theme-dark.scss]
        highlight-style:
          light: github
          dark: github
        link-external-icon: true
        link-external-newwindow: true
        code-copy: true
        toc: true
        toc-expand: true
        include-in-header:
          - "assets/_analytics.html"
          - "assets/_logo-dropdown.html"
          - "assets/_version-dropdown.html"
          - "assets/_dynamic-versions.html"
          - "assets/_mobile-menu.html"
        resources:
          - "assets/images/"


