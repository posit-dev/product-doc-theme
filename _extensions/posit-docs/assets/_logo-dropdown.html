<!-- Products menu: the logo links home; "Docs" + caret opens the menu (click or keyboard) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const logoLink = document.querySelector('.navbar-brand-logo');
  const navbarTitle = document.querySelector('.navbar-title');
  if (!logoLink) return;
  const container = logoLink.parentNode;

  // The logo keeps linking home. The site title ("Docs") becomes the menu button, with a caret.
  const lockup = document.createElement('div');
  lockup.className = 'navbar-lockup';
  container.insertBefore(lockup, logoLink);
  lockup.appendChild(logoLink);

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'navbar-brand navbar-docs-trigger';
  trigger.setAttribute('aria-expanded', 'false');
  trigger.setAttribute('aria-controls', 'posit-docs-menu');
  // The visible title can be hidden on small screens, so always name the button
  trigger.setAttribute('aria-label', (navbarTitle ? navbarTitle.textContent.trim() + ': ' : '') + 'browse all Posit documentation');
  const titleLink = navbarTitle ? navbarTitle.closest('a') : null;
  if (titleLink) {
    // The version dropdown may already sit inside the title link; keep it outside the button
    const versionWrapper = titleLink.querySelector('.version-dropdown-wrapper');
    trigger.appendChild(navbarTitle);
    titleLink.remove();
    lockup.appendChild(trigger);
    if (versionWrapper) lockup.after(versionWrapper);
  } else {
    lockup.appendChild(trigger);
  }
  const caret = document.createElement('i');
  caret.className = 'bi bi-chevron-down navbar-docs-caret';
  caret.setAttribute('aria-hidden', 'true');
  trigger.appendChild(caret);

  // On phones the button is hidden to save room; the same menu opens from the hamburger drawer
  const drawerList = document.querySelector('#navbarCollapse .navbar-nav.ms-auto');
  let drawerButton = null;
  if (drawerList) {
    const item = document.createElement('li');
    item.className = 'nav-item navbar-products-item';
    drawerButton = document.createElement('button');
    drawerButton.type = 'button';
    drawerButton.className = 'nav-link';
    drawerButton.setAttribute('aria-expanded', 'false');
    drawerButton.setAttribute('aria-controls', 'posit-docs-menu');
    drawerButton.textContent = 'Posit products';
    item.appendChild(drawerButton);
    drawerList.insertBefore(item, drawerList.firstChild);
  }

  // Create the menu. A nav landmark, hidden from assistive tech while closed.
  const dropdown = document.createElement('nav');
  dropdown.id = 'posit-docs-menu';
  dropdown.className = 'logo-dropdown-menu logo-megamenu';
  dropdown.setAttribute('aria-label', 'Posit products documentation');
  dropdown.innerHTML = `
    <h3 class="megamenu-title">Posit Products Documentation</h3>
    <div class="megamenu-grid">
      <div class="megamenu-column">
        <h4 class="megamenu-heading">Enterprise</h4>
        <a href="https://docs.posit.co/connect/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/product icons_connect-icon-1.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Posit Connect</span>
            <span class="megamenu-description">Publish and share data products</span>
          </span>
        </a>
        <a href="https://docs.posit.co/ide/server-pro/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/product icons_workbench-icon-1.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Posit Workbench</span>
            <span class="megamenu-description">Scalable data science workstation</span>
          </span>
        </a>
        <a href="https://docs.posit.co/rspm/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/product icons_pkgmgr-icon-1.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Posit Package Manager</span>
            <span class="megamenu-description">Manage R and Python packages</span>
          </span>
        </a>
        <a href="https://docs.posit.co/chronicle/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/product icons_chronicle-icon-1.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Posit Chronicle</span>
            <span class="megamenu-description">Manage system dependencies</span>
          </span>
        </a>
      </div>
      <div class="megamenu-column">
        <h4 class="megamenu-heading">Desktop</h4>
        <a href="https://docs.posit.co/ide/user/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/rstudio-icon.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">RStudio IDE</span>
            <span class="megamenu-description">Open source IDE for R</span>
          </span>
        </a>
        <a href="https://docs.posit.co/ide/desktop-pro/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/rstudio-icon.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">RStudio Desktop Pro</span>
            <span class="megamenu-description">Professional IDE for R</span>
          </span>
        </a>
        <a href="https://positron.posit.co/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/Positron-Logo-2026_symbol-fullcolor.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Positron IDE</span>
            <span class="megamenu-description">Next-generation data science IDE</span>
          </span>
        </a>
      </div>
      <div class="megamenu-column">
        <h4 class="megamenu-heading">Hosted</h4>
        <a href="https://docs.posit.co/connect-cloud/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/product icons_connectcld-icon-1.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Posit Connect Cloud</span>
            <span class="megamenu-description">Cloud-hosted publishing platform</span>
          </span>
        </a>
        <a href="https://docs.posit.co/cloud/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/product icons_positcloud-icon-1.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Posit Cloud</span>
            <span class="megamenu-description">Cloud-based data science environment</span>
          </span>
        </a>
        <a href="https://docs.posit.co/shinyapps.io/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/shiny.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">shinyapps.io</span>
            <span class="megamenu-description">Host Shiny applications</span>
          </span>
        </a>
      </div>
      <div class="megamenu-column">
        <h4 class="megamenu-heading">Open Source</h4>
        <a href="https://quarto.org/docs/get-started/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/quarto.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Quarto</span>
            <span class="megamenu-description">Scientific publishing system</span>
          </span>
        </a>
        <a href="https://shiny.posit.co/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/shiny.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Shiny</span>
            <span class="megamenu-description">Interactive web apps with R/Python</span>
          </span>
        </a>
        <a href="https://www.tidyverse.org/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/tidyverse.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Tidyverse</span>
            <span class="megamenu-description">Collection of R packages for data science</span>
          </span>
        </a>
        <a href="https://www.tidymodels.org/" class="logo-dropdown-item">
          <img src="_extensions/posit-docs/assets/images/tidymodels.svg" alt="" class="megamenu-icon">
          <span class="megamenu-link-content">
            <span class="megamenu-product-name">Tidymodels</span>
            <span class="megamenu-description">Machine learning with tidyverse</span>
          </span>
        </a>
      </div>
    </div>
    <div class="megamenu-footer">
      <a href="https://docs.posit.co/" class="megamenu-all-link">Browse all Posit documentation <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
    </div>
  `;

  lockup.appendChild(dropdown);

  // Keep the menu inside the viewport horizontally
  const positionDropdown = function() {
    dropdown.style.left = '0';
    dropdown.style.right = 'auto';
    const rect = dropdown.getBoundingClientRect();
    if (rect.right > window.innerWidth) {
      dropdown.style.left = `${-(rect.right - window.innerWidth) - 20}px`;
    }
    const after = dropdown.getBoundingClientRect();
    if (after.left < 0) {
      dropdown.style.left = `${Math.abs(after.left) + 20}px`;
    }
  };

  // Click or Enter/Space toggles it. No hover behavior: it is predictable for every input.
  const controls = [trigger, drawerButton].filter(Boolean);
  const isOpen = function() { return dropdown.classList.contains('show'); };
  const setExpanded = function(value) {
    controls.forEach(function(el) { el.setAttribute('aria-expanded', String(value)); });
  };
  const open = function() {
    positionDropdown();
    dropdown.classList.add('show');
    setExpanded(true);
  };
  const close = function() {
    dropdown.classList.remove('show');
    setExpanded(false);
  };
  // The visible control, so focus has somewhere to go when the menu closes
  const visibleControl = function() {
    if (trigger.offsetParent !== null) return trigger;
    if (drawerButton && drawerButton.offsetParent !== null) return drawerButton;
    return document.querySelector('.navbar-toggler') || trigger;
  };

  trigger.addEventListener('click', function() { isOpen() ? close() : open(); });

  if (drawerButton) {
    drawerButton.addEventListener('click', function() {
      if (isOpen()) { close(); return; }
      // Close the drawer first so the menu is not covered by it
      const drawer = document.querySelector('#navbarCollapse');
      const toggler = document.querySelector('.navbar-toggler');
      if (drawer && drawer.classList.contains('show') && toggler) toggler.click();
      open();
      requestAnimationFrame(function() {
        const first = dropdown.querySelector('a');
        if (first) first.focus();
      });
    });
  }

  const isControl = function(node) {
    return controls.some(function(el) { return el.contains(node); });
  };

  document.addEventListener('click', function(event) {
    if (isOpen() && !dropdown.contains(event.target) && !isControl(event.target)) close();
  });

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape' || !isOpen()) return;
    const hadFocus = dropdown.contains(document.activeElement) || isControl(document.activeElement);
    close();
    if (hadFocus) visibleControl().focus();
  });

  // Close when keyboard focus moves somewhere else on the page
  document.addEventListener('focusin', function(event) {
    if (isOpen() && !dropdown.contains(event.target) && !isControl(event.target)) close();
  });

  window.addEventListener('resize', function() {
    if (isOpen()) positionDropdown();
  });
});
</script>
