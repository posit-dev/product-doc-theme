<!-- Products & Support: last item in the navbar, beside search. A popup on the full
     navbar, and an inline list inside the hamburger drawer. Replaces the old Help menu. -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const navbar = document.querySelector('nav.navbar');
  const rightList = document.querySelector('#navbarCollapse .navbar-nav.ms-auto');
  const toggler = document.querySelector('.navbar-toggler');
  if (!navbar || !rightList) return;

  // Quarto gives every page the path back to the site root, so icons load from nested pages too
  const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  const iconBase = (offsetMeta ? offsetMeta.content : './') + '_extensions/posit-docs/assets/images/';

  const sections = [
    { heading: 'Enterprise', items: [
      { name: 'Posit Connect', description: 'Publish and share data products', href: 'https://docs.posit.co/connect/', icon: 'product icons_connect-icon-1.svg' },
      { name: 'Posit Workbench', description: 'Scalable data science workstation', href: 'https://docs.posit.co/ide/server-pro/', icon: 'product icons_workbench-icon-1.svg' },
      { name: 'Posit Package Manager', description: 'Manage R and Python packages', href: 'https://docs.posit.co/rspm/', icon: 'product icons_pkgmgr-icon-1.svg' },
      { name: 'Posit Chronicle', description: 'Manage system dependencies', href: 'https://docs.posit.co/chronicle/', icon: 'product icons_chronicle-icon-1.svg' }
    ]},
    { heading: 'Desktop', items: [
      { name: 'RStudio IDE', description: 'Open source IDE for R', href: 'https://docs.posit.co/ide/user/', icon: 'rstudio-icon.svg' },
      { name: 'RStudio Desktop Pro', description: 'Professional IDE for R', href: 'https://docs.posit.co/ide/desktop-pro/', icon: 'rstudio-icon.svg' },
      { name: 'Positron IDE', description: 'Next-generation data science IDE', href: 'https://positron.posit.co/', icon: 'Positron-Logo-2026_symbol-fullcolor.svg' }
    ]},
    { heading: 'Hosted', items: [
      { name: 'Posit Connect Cloud', description: 'Cloud-hosted publishing platform', href: 'https://docs.posit.co/connect-cloud/', icon: 'product icons_connectcld-icon-1.svg' },
      { name: 'Posit Cloud', description: 'Cloud-based data science environment', href: 'https://docs.posit.co/cloud/', icon: 'product icons_positcloud-icon-1.svg' },
      { name: 'shinyapps.io', description: 'Host Shiny applications', href: 'https://docs.posit.co/shinyapps.io/', icon: 'shiny.svg' }
    ]},
    { heading: 'Open Source', items: [
      { name: 'Quarto', description: 'Scientific publishing system', href: 'https://quarto.org/docs/get-started/', icon: 'quarto.svg' },
      { name: 'Shiny', description: 'Interactive web apps with R/Python', href: 'https://shiny.posit.co/', icon: 'shiny.svg' },
      { name: 'Tidyverse', description: 'Collection of R packages for data science', href: 'https://www.tidyverse.org/', icon: 'tidyverse.svg' },
      { name: 'Tidymodels', description: 'Machine learning with tidyverse', href: 'https://www.tidymodels.org/', icon: 'tidymodels.svg' }
    ]}
  ];

  const footerLinks = [
    { name: 'Browse all Posit documentation', href: 'https://docs.posit.co/', arrow: true },
    { name: 'Posit Support', href: 'https://support.posit.co/hc/en-us/requests/new' },
    { name: 'posit.co', href: 'https://posit.co/' }
  ];

  // Small DOM helpers: an element with a class and optional text, and a decorative icon
  const el = function(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  };
  const icon = function(file, className) {
    const img = el('img', className);
    img.src = iconBase + file;
    img.alt = '';
    return img;
  };

  // The button replaces the old "Help" menu and sits last in the list, beside search,
  // so it is in the same place on every site
  Array.from(rightList.children).forEach(function(li) {
    const link = li.querySelector('.nav-link');
    if (link && link.textContent.trim() === 'Help') li.remove();
  });

  const item = el('li', 'nav-item navbar-products-item');
  const trigger = el('button', 'nav-link navbar-products-trigger');
  const caret = el('i', 'bi bi-chevron-down navbar-docs-caret');
  caret.setAttribute('aria-hidden', 'true');
  trigger.type = 'button';
  trigger.setAttribute('aria-expanded', 'false');
  trigger.setAttribute('aria-controls', 'posit-docs-menu');
  trigger.append(el('span', 'menu-text', 'Products & Support'), ' ', caret);
  item.appendChild(trigger);
  rightList.appendChild(item);

  // The popup: a nav landmark, hidden from assistive tech while closed
  const popup = el('nav', 'logo-dropdown-menu logo-megamenu');
  popup.id = 'posit-docs-menu';
  popup.setAttribute('aria-label', 'Posit products and support');
  popup.appendChild(el('h3', 'megamenu-title', 'Posit Products Documentation'));

  const grid = el('div', 'megamenu-grid');
  sections.forEach(function(section) {
    const column = el('div', 'megamenu-column');
    column.appendChild(el('h4', 'megamenu-heading', section.heading));
    section.items.forEach(function(product) {
      const link = el('a', 'logo-dropdown-item');
      const text = el('span', 'megamenu-link-content');
      link.href = product.href;
      text.append(el('span', 'megamenu-product-name', product.name), el('span', 'megamenu-description', product.description));
      link.append(icon(product.icon, 'megamenu-icon'), text);
      column.appendChild(link);
    });
    grid.appendChild(column);
  });
  popup.appendChild(grid);

  const footer = el('div', 'megamenu-footer');
  footerLinks.forEach(function(entry) {
    const link = el('a', 'megamenu-all-link', entry.name);
    link.href = entry.href;
    if (entry.arrow) {
      const arrow = el('i', 'bi bi-arrow-right');
      arrow.setAttribute('aria-hidden', 'true');
      link.append(' ', arrow);
    }
    footer.appendChild(link);
  });
  popup.appendChild(footer);
  navbar.appendChild(popup);

  // The same links as a flat list for the hamburger drawer
  const list = el('div', 'navbar-products-list');
  list.id = 'posit-docs-products-list';
  list.setAttribute('role', 'group');
  list.setAttribute('aria-label', 'Posit products and support');
  const addSection = function(heading, links, className) {
    const section = el('div', 'navbar-products-section' + (className ? ' ' + className : ''));
    if (heading) section.appendChild(el('div', 'navbar-products-heading', heading));
    links.forEach(function(entry) {
      const link = el('a', 'navbar-products-link');
      link.href = entry.href;
      if (entry.icon) link.appendChild(icon(entry.icon));
      link.append(entry.name);
      section.appendChild(link);
    });
    list.appendChild(section);
  };
  sections.forEach(function(section) { addSection(section.heading, section.items); });
  addSection('', footerLinks, 'navbar-products-footer');
  item.appendChild(list);

  // Drawer mode: the toggler is only visible below the theme's navbar breakpoint,
  // so asking it keeps this script from having to know the breakpoint
  const inDrawer = function() {
    return !!toggler && getComputedStyle(toggler).display !== 'none';
  };

  const popupOpen = function() { return popup.classList.contains('show'); };
  const listOpen = function() { return item.classList.contains('inline-open'); };

  const setPopup = function(on) {
    popup.classList.toggle('show', on);
    trigger.setAttribute('aria-expanded', on ? 'true' : 'false');
  };
  const setList = function(on) {
    item.classList.toggle('inline-open', on);
    trigger.setAttribute('aria-expanded', on ? 'true' : 'false');
    trigger.setAttribute('aria-controls', on || inDrawer() ? list.id : popup.id);
  };
  const closeAll = function() { setPopup(false); setList(false); };

  trigger.addEventListener('click', function() {
    if (inDrawer()) setList(!listOpen());
    else setPopup(!popupOpen());
  });

  // Click outside, Escape and focus leaving all close it. There is no hover behavior,
  // so it works the same for every input.
  const isInside = function(node) { return popup.contains(node) || item.contains(node); };

  document.addEventListener('click', function(event) {
    if (popupOpen() && !isInside(event.target)) setPopup(false);
  });

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape' || !(popupOpen() || listOpen())) return;
    const hadFocus = isInside(document.activeElement);
    closeAll();
    if (hadFocus) trigger.focus();
  });

  document.addEventListener('focusin', function(event) {
    if (popupOpen() && !isInside(event.target)) setPopup(false);
  });

  // Closing the drawer or crossing the breakpoint resets both
  const drawer = document.querySelector('#navbarCollapse');
  if (drawer) drawer.addEventListener('hidden.bs.collapse', closeAll);
  let wasDrawer = inDrawer();
  window.addEventListener('resize', function() {
    if (inDrawer() !== wasDrawer) {
      wasDrawer = inDrawer();
      closeAll();
    }
  });
});
</script>
