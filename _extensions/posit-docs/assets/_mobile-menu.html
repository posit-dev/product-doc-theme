<style>
/* Animated hamburger menu icon */
.navbar-toggler {
  position: relative;
  width: 30px;
  height: 24px;
  padding: 0;
  border: none;
  background: transparent;
}

.navbar-toggler:focus {
  box-shadow: none;
}

.hamburger-icon {
  position: relative;
  width: 20px;
  height: 16px;
  margin: 0 auto;
}

.hamburger-icon span {
  display: block;
  position: absolute;
  height: 2px;
  width: 100%;
  background: currentColor;
  border-radius: 2px;
  opacity: 1;
  left: 0;
  transform: rotate(0deg);
  transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out, top 0.25s ease-in-out;
}

.hamburger-icon span:nth-child(1) {
  top: 0px;
}

.hamburger-icon span:nth-child(2) {
  top: 7px;
}

.hamburger-icon span:nth-child(3) {
  top: 14px;
}

/* Transform to X when active */
.navbar-toggler.active .hamburger-icon span:nth-child(1) {
  top: 7px;
  transform: rotate(45deg);
}

.navbar-toggler.active .hamburger-icon span:nth-child(2) {
  opacity: 0;
}

.navbar-toggler.active .hamburger-icon span:nth-child(3) {
  top: 7px;
  transform: rotate(-45deg);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const navbarToggler = document.querySelector('.navbar-toggler');
  const navbarCollapse = document.querySelector('.navbar-collapse');

  if (!navbarToggler || !navbarCollapse) return;

  // Replace toggler icon with animated hamburger
  navbarToggler.innerHTML = `
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  navbarCollapse.addEventListener('show.bs.collapse', function() {
    navbarToggler.classList.add('active');
  });

  navbarCollapse.addEventListener('shown.bs.collapse', function() {
    document.body.style.overflow = 'hidden';
  });

  navbarCollapse.addEventListener('hide.bs.collapse', function() {
    navbarToggler.classList.remove('active');
  });

  navbarCollapse.addEventListener('hidden.bs.collapse', function() {
    document.body.style.overflow = '';
  });

  navbarCollapse.querySelectorAll('.nav-link').forEach(function(link) {
    link.addEventListener('click', function() {
      if (window.innerWidth < 1300) {
        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse) || new bootstrap.Collapse(navbarCollapse, { toggle: false });
        bsCollapse.hide();
      }
    });
  });

  window.addEventListener('resize', function() {
    if (window.innerWidth >= 1300 && navbarCollapse.classList.contains('show')) {
      const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
      if (bsCollapse) {
        bsCollapse.hide();
      }
    }
  });
});
</script>
