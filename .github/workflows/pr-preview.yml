# Renders the example site for each pull request and publishes it to
# https://posit-dev.github.io/product-doc-theme/pr-preview/pr-<number>/

name: PR Preview

concurrency: preview-${{ github.ref }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Render site
        if: github.event.action != 'closed'
        working-directory: example
        run: |
          quarto render --site-url \
            "https://posit-dev.github.io/product-doc-theme/pr-preview/pr-${{ github.event.pull_request.number }}/"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: example/_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
